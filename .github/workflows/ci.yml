name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libpq-dev libgdal-dev

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # The same lane the pre-commit hook runs, which is why it is a script and
      # not a list of test files here.
      #
      # This step used to be `pytest -m "not integration"` against a
      # DATABASE_URL naming a Postgres that does not exist in the runner, so it
      # failed on every push from at least 2026-07-15 onward and nobody could
      # make it green. A red build that cannot go green stops being read: 117
      # commits accumulated behind it. The lane below needs neither Postgres nor
      # api.main, runs in about four seconds, and is the subset that catches
      # structural drift, which is the class of bug this repo keeps shipping.
      #
      # It is deliberately narrower than the whole non-integration suite. The
      # rest needs a database and belongs in a job that provisions one; adding
      # that is worth doing and is not what unblocks the push.
      # DATABASE_URL is set to a DSN nothing connects to, and it is load-bearing.
      # models/database.py builds its engine at import time and raises without
      # one, so any lane test importing a module that imports it dies during
      # collection rather than failing an assertion: tests/test_freshness_contract.py
      # imports scripts.daily_health_check, which imports models.database, and
      # that single chain took the whole job down. GUARDS_NO_DB deselects the
      # handful of checks that genuinely query, so nothing here opens a socket.
      # The proper fix is a lazily built engine; this is the honest small one.
      - name: Run repo guards
        env:
          DATABASE_URL: postgresql://guards:guards@127.0.0.1:1/guards_never_connects
        run: PYTHON=python GUARDS_NO_DB=1 ./scripts/guards.sh

  # The second lane: a real Postgres, the schema built the way production built
  # it, and every test that does not need records in the tables.
  #
  # Two things this catches that the guard lane cannot. The migration chain has
  # to apply from nothing, which is the only place that is ever proven: the
  # production database was migrated one revision at a time over months and
  # would not notice a chain that no longer replays. And 1,158 tests exercise
  # the app for real, against 219 grep-level assertions.
  #
  # It cannot hold 918,000 parcels, so the tests that assert on rendered records
  # carry `needs_data` and skip here. They still run on the box, where the
  # records are. tests/conftest.py decides that by asking the database rather
  # than by reading an environment variable, so a CI run that did have data
  # would run them.
  schema-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:14-3.3
        env:
          POSTGRES_USER: pulsecities_user
          POSTGRES_PASSWORD: ci_only_not_a_secret
          POSTGRES_DB: pulsecities
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://pulsecities_user:ci_only_not_a_secret@localhost:5432/pulsecities

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libpq-dev libgdal-dev

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build the schema from the migration chain
        run: alembic upgrade head

      - name: Run the suite that does not need records
        run: pytest -m "not integration" -q
