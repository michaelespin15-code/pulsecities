# Security headers for pulsecities.com.
# Installed at /etc/nginx/snippets/pulsecities-security-headers.conf.
#
# nginx add_header inheritance is all-or-nothing: a location that sets any
# header of its own silently drops every server-level add_header. Every
# location that touches Cache-Control therefore includes this snippet, and the
# server block includes it for the locations that don't.
#
# HSTS is kept at one day deliberately: long enough to matter, short enough to
# back out of within a day if TLS ever has to come down.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Strict-Transport-Security "max-age=86400" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Content Security Policy, report-only for now.
#
# Report-only because `script-src` cannot be tightened yet and shipping a
# permissive policy as enforcing would buy nothing while risking a blank map.
# Every page carries inline <script>, so the policy needs 'unsafe-inline',
# which is most of what a CSP is for. The usual fix is a per-request nonce, and
# that is exactly what this stack cannot do: SSR HTML is served out of the
# nginx cache, so one nonce would be replayed to every visitor of a cached
# page, which is worse than none. The real path to an enforcing policy is
# hashes over the inline blocks, or lifting them into files under /vendor.
#
# The external origins are the whole list, checked against the source and then
# against a browser: Google Fonts for the stylesheet and the font files,
# plausible.io for analytics, and CARTO for the basemap. CARTO is wildcarded on
# purpose. The style.json is served from basemaps.cartocdn.com but names
# tiles.basemaps.cartocdn.com for the vector tiles, the sprite sheet and the
# glyph ranges, so naming only the first host is a policy that passes every
# page on the site and breaks the map. MapLibre builds its workers from a blob,
# hence worker-src.
add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://plausible.io; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://*.cartocdn.com; connect-src 'self' https://plausible.io https://*.cartocdn.com; worker-src 'self' blob:" always;

# Cache visibility. Empty on anything served off disk, and nginx omits an
# add_header whose value is empty, so this only appears on proxied routes.
add_header X-Cache $upstream_cache_status always;
