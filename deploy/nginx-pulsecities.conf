proxy_cache_path /tmp/nginx_og_cache levels=1:2 keys_zone=og_cache:5m max_size=50m inactive=25h use_temp_path=off;

# Server-rendered HTML. Every SSR page is anonymous and byte-identical for all
# visitors, so a repeat hit has no business waking a Python worker. Sized for
# the long tail: ~15k crawlable URLs across /neighborhood/, /property/ and
# /llc/, which is where a crawler sweep used to land as a cold render each time.
proxy_cache_path /var/cache/nginx/ssr levels=1:2 keys_zone=ssr_cache:20m max_size=500m inactive=60m use_temp_path=off;

upstream pulsecities_upstream {
    server unix:/tmp/gunicorn.sock fail_timeout=0;
}

# Cache policy for the Tailwind build, picked by whether the request carries a
# content stamp. `npm run build:css` writes the hash into the link as ?v=, so a
# stamped URL names one exact build and can be cached forever; a bare request
# (an old bookmark, a crawler) still points at a file that changes in place, so
# it keeps the conservative revalidate. A map rather than an `if`, since
# add_header inside an if block silently drops the security headers.
map $args $tailwind_cache_control {
    ""      "public, max-age=3600, must-revalidate";
    default "public, max-age=2592000, immutable";
}

# The app collapses lang to exactly two values (frontend.py: lang = "es" if
# lang == "es" else "en"); the cache key must collapse it the same way. Keying
# on the raw $arg_lang made every distinct ?lang= value a fresh cache entry:
# one loop over ?lang=<counter> evicted the whole warm set and paid a worker
# render per request, verified live before this map went in.
map $arg_lang $ssr_lang {
    "es"    "es";
    default "";
}

# Redirect all HTTP to HTTPS
# Per-IP throttle for the uncached SSR routes that do real per-request work.
#
# Was 5r/s, and the comment claimed that "absorbs any human or crawler". The
# access logs disagree: over 14 days bingbot took 18 rate-limit rejections and
# Googlebot one. Bing crawls in bursts from a narrow IP range, so it trips a
# per-IP limit that Google's spread-out fleet never notices. Turning away the
# engines you are trying to rank in, on the templates that are 65,000 of 65,944
# sitemap URLs, costs more than this limit was protecting.
#
# A user-agent map that exempted known crawlers was tried first and dropped:
# the exemption is trivially spoofable, and a config whose behaviour is hard to
# verify is worse than a plainer one. So the ceiling simply moves. 20r/s
# sustained with a burst of 60 is roughly four times Bing's observed peak, and
# everything behind it is served from the SSR proxy cache anyway, so the cost
# of the extra headroom lands on nginx rather than on Postgres.
limit_req_zone $binary_remote_addr zone=ssr_heavy:10m rate=20r/s;

# The real per-IP budget for the public API. slowapi's per-route limits live in
# each gunicorn worker's memory, so they enforce their number once per worker
# and reset on every reload; nginx keeps one counter per IP in shared memory,
# which is the only place the documented figure can actually hold. 2r/s sustains
# the 120/min that /developers now quotes, and the burst covers a map page that
# opens several calls at once.
limit_req_zone $binary_remote_addr zone=api_public:10m rate=2r/s;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name pulsecities.com;

    # Webroot location for Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /root/pulsecities/frontend;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pulsecities.com;

    # TLS — Let's Encrypt certificate (provisioned in Task 2)
    ssl_certificate /etc/letsencrypt/live/pulsecities.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pulsecities.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss image/svg+xml;
    gzip_min_length 256;
    gzip_comp_level 6;

    # Security headers. add_header inheritance is all-or-nothing: any location
    # that sets its own header drops every server-level one, so each location
    # below that touches Cache-Control re-includes the same snippet.
    include snippets/pulsecities-security-headers.conf;

    # Server-scope ceiling so no location ships without one. Nineteen SSR
    # locations had no limit_req at all, which combined with a cache-buster
    # was a render-per-request hole. Locations that declare their own zone
    # (/api/ uses api_public) override this; the per-location ssr_heavy lines
    # below are now redundant but kept where they document intent.
    limit_req zone=ssr_heavy burst=60 nodelay;

    # Serve pre-compressed .gz twins where they exist (sitemaps, vendor JS):
    # 11.5 MB of sitemap XML was being gzip-6'd from scratch on every crawler
    # fetch, on the same two cores that render pages.
    gzip_static on;

    # Shared cache for the proxied HTML routes, inherited by every location that
    # doesn't name its own zone (/og/ and /badge/ keep og_cache). The app sends
    # Cache-Control: no-cache on HTML on purpose, so browsers revalidate after a
    # deploy and never show a stale page; ignoring it here scopes that
    # instruction to the browser and lets the shared cache in front of it work.
    # Set-Cookie is deliberately NOT ignored, so anything that ever starts
    # setting one drops out of the cache on its own.
    proxy_cache ssr_cache;
    # Key on the path plus ?lang only. The default key includes the whole query
    # string, so ?anything=random was a fresh render every time and a trivial way
    # to walk straight past the cache. lang is the only query parameter any SSR
    # route reads; a new one MUST be added here or its pages will serve each
    # other's cached output.
    proxy_cache_key "$scheme$host$uri?lang=$ssr_lang";
    # 10m, not 1m: freshness is governed by the app-level memos (1h page
    # caches, 6h data memos), so a short TTL here bought nothing except a
    # background revalidation into gunicorn 60 times an hour per hot URL.
    proxy_cache_valid 200 301 302 10m;
    proxy_cache_valid 404 30s;
    proxy_ignore_headers Cache-Control Expires;
    # One request repopulates a cold key while the rest wait on it, instead of
    # every concurrent miss rendering the same page.
    proxy_cache_lock on;
    proxy_cache_lock_timeout 10s;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;

    # The Tailwind build is written in place to a fixed filename, so the URL
    # used to stay the same while the bytes changed. That is why this location
    # exists at all: the 30-day immutable policy below served stale UI for a
    # month after any style change. The build now stamps its content hash into
    # the link, so a stamped request is safe to cache forever and only a bare
    # one still needs to revalidate. See the map above.
    location = /tailwind.min.css {
        root /root/pulsecities/frontend;
        add_header Cache-Control $tailwind_cache_control;
        include snippets/pulsecities-security-headers.conf;
        access_log off;
    }

    # Versioned static assets — long cache, immutable
    location ~* \.(css|js|woff|woff2|ttf|eot|svg|png|jpg|webp|avif|gif|ico)$ {
        root /root/pulsecities/frontend;
        add_header Cache-Control "public, max-age=2592000, immutable";
        include snippets/pulsecities-security-headers.conf;
        access_log off;
    }

    # Neighborhood deep links — proxied to FastAPI for server-side OG/meta injection
    location /neighborhood/ {
        limit_req zone=ssr_heavy burst=60 nodelay;
        proxy_pass http://pulsecities_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Property/building deep links — proxied to FastAPI for server-side OG/meta injection
    location /property/ {
        limit_req zone=ssr_heavy burst=60 nodelay;
        proxy_pass http://pulsecities_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Operator profile pages — proxied to FastAPI for server-side OG/meta injection
    location /operator/ {
        limit_req zone=ssr_heavy burst=60 nodelay;
        proxy_pass http://pulsecities_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Operators directory — server-side rendered list of all operator clusters
    location = /operators {
        proxy_pass http://pulsecities_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Embeddable score badges — must come before the static assets regex so
    # .svg under /badge/ is proxied to FastAPI, not looked up on disk
    location ^~ /badge/ {
        proxy_cache og_cache;
        proxy_cache_key "$uri";
        proxy_cache_valid 200 1h;
        proxy_cache_use_stale error timeout updating;
        proxy_pass http://pulsecities_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Printable evidence briefs — server-side rendered by FastAPI
    location /brief/ {
        limit_req zone=ssr_heavy burst=60 nodelay;
        proxy_pass http://pulsecities_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The ops shell must not be fetchable around the token gate
    location = /ops.html {
        return 404;
    }

    # Internal ops dashboard — token-gated in the app, 404 without it.
    # proxy_cache off: it reads ?t=, which the cache key does not carry, so a
    # cached anonymous 404 could lock the owner out (and a cached 200 would
    # serve the shell to anonymous callers) for the TTL.
    location = /ops {
        proxy_cache off;
        proxy_pass http://pulsecities_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Weekly review — server-side rendered, always shows the current week
    # Weekly review archive + individual completed-week editions
    location = /this-week/archive {
        proxy_pass http://pulsecities_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ "^/week/[0-9]{4}-W[0-9]{2}$" {
        proxy_pass http://pulsecities_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /this-week {
        proxy_pass http://pulsecities_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Borough pages — clean URLs proxied to the /borough/{slug} route.
    # $is_args$args forwards the query string: proxy_pass with a URI part
    # drops it otherwise, which would strip ?lang=es.
    location ~ ^/(brooklyn|manhattan|queens|bronx|staten-island)$ {
        proxy_pass http://pulsecities_upstream/borough/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Trailing-slash canonicalization. The content routes below are exact-match
    # (no trailing slash), so /flips/ etc. fall through to the static catch-all
    # and 404. 301 them to the canonical slash-less URL. Longer paths are listed
    # before their prefixes so the alternation matches greedily; query string is
    # preserved via $is_args$args.
    location ~ "^/(week/[0-9]{4}-W[0-9]{2}|neighborhood/[0-9]{5}|operator/[A-Za-z0-9._-]+|property/[0-9]+|evictions/[a-z0-9-]+|network/[a-z0-9-]+|network|flips/editions|this-week/archive|operators|neighborhoods|llc/[a-z0-9-]+|evictions|eviction-case|who-owns-my-building|is-my-building-rent-stabilized|llc|flips|radar|displacement|this-week|methodology|about|privacy|developers|press|status|map|brooklyn|manhattan|queens|bronx|staten-island)/$" {
        return 301 $scheme://$host/$1$is_args$args;
    }

    # Neighborhoods directory — server-side rendered borough-grouped index
    location = /neighborhoods {
        proxy_pass http://pulsecities_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Eviction Flips — human-reviewed weekly editions archive
    location = /flips/editions {
        proxy_pass http://pulsecities_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Flip Watch — server-side rendered citywide renovation-flip feed
    location = /llc {
        proxy_pass http://pulsecities_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /llc/ {
        limit_req zone=ssr_heavy burst=60 nodelay;
        proxy_pass http://pulsecities_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /evictions {
        proxy_pass http://pulsecities_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Entity-family hubs.
    location ~ "^/network/[a-z0-9-]+$" {
        proxy_pass http://pulsecities_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Per-neighbourhood eviction pages. SSR paths are allow-listed one at a
    # time here, so without this block /evictions/wakefield falls through to
    # the static root and 404s while rendering perfectly in the app.
    location ~ "^/evictions/[a-z0-9-]+$" {
        proxy_pass http://pulsecities_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Eviction case lookup. The only SSR route that reads a query parameter other
    # than ?lang, and the shared cache keys on path plus ?lang alone, so every
    # lookup would be served the cached empty form. Rather than widen the key
    # and hand anyone a way to fill the zone with 37,905 docket numbers, this
    # location opts out; the empty form is cached in the app for an hour anyway.
    location = /eviction-case {
        proxy_cache off;
        # 60 like every other SSR route. 30 looked prudent for a route that
        # runs a lookup per submit, but the lookup is one indexed query at ~5ms,
        # and a crawler sweeping the sitemap meets the burst, not the rate.
        limit_req zone=ssr_heavy burst=60 nodelay;
        proxy_pass http://pulsecities_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /network {
        proxy_pass http://pulsecities_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /is-my-building-rent-stabilized {
        proxy_pass http://pulsecities_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /who-owns-my-building {
        proxy_pass http://pulsecities_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /flips {
        proxy_pass http://pulsecities_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Speculation Radar — server-side rendered concentrated-buying feed
    location = /radar {
        proxy_pass http://pulsecities_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Displacement showcase — server-side rendered citywide findings page
    location = /displacement {
        proxy_pass http://pulsecities_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Full map app
    location = /map {
        root /root/pulsecities/frontend;
        try_files /app.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma no-cache;
        include snippets/pulsecities-security-headers.conf;
    }

    # Methodology — standalone editorial page
    location = /methodology {
        root /root/pulsecities/frontend;
        try_files /methodology.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma no-cache;
        include snippets/pulsecities-security-headers.conf;
    }

    # What this site publishes: the privacy and withholding disclosure
    location = /privacy {
        root /root/pulsecities/frontend;
        try_files /privacy.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma no-cache;
        include snippets/pulsecities-security-headers.conf;
    }

    # About page
    location = /about {
        root /root/pulsecities/frontend;
        try_files /about.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma no-cache;
        include snippets/pulsecities-security-headers.conf;
    }

    # Public API docs — integration path for newsroom data teams
    location = /developers {
        root /root/pulsecities/frontend;
        try_files /developers.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma no-cache;
        include snippets/pulsecities-security-headers.conf;
    }

    # Press page — verified findings with document IDs, for reporters
    location = /press {
        root /root/pulsecities/frontend;
        try_files /press.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma no-cache;
        include snippets/pulsecities-security-headers.conf;
    }

    # Data status page
    location = /status {
        root /root/pulsecities/frontend;
        try_files /status.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma no-cache;
        include snippets/pulsecities-security-headers.conf;
    }

    # llms.txt — force UTF-8 so en dashes and accents render, not mojibake
    location = /llms.txt {
        root /root/pulsecities/frontend;
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-cache";
        include snippets/pulsecities-security-headers.conf;
    }

    # Landing page — primary entry point
    location = / {
        root /root/pulsecities/frontend;
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma no-cache;
        include snippets/pulsecities-security-headers.conf;
    }

    # Remaining static files. Unknown paths get a real 404, not the landing
    # page — a homepage-as-200 fallback hides broken links from crawlers and
    # uptime checks alike.
    location / {
        root /root/pulsecities/frontend;
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma no-cache;
        include snippets/pulsecities-security-headers.conf;
    }

    error_page 404 /404.html;

    # Dynamic OG images — must come before the static assets regex so .png
    # files under /og/ are proxied to FastAPI, not served from disk
    location ^~ /og/ {
        limit_req zone=ssr_heavy burst=60 nodelay;
        proxy_cache og_cache;
        proxy_cache_key "$uri";
        proxy_cache_valid 200 24h;
        proxy_cache_use_stale error timeout updating;
        proxy_pass http://pulsecities_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # A throttled API caller gets JSON and a real backoff hint, not nginx's
    # stock HTML error page. Retry-After matches the 2r/s drain rate: one slot
    # frees every 500ms, so a second is the honest answer.
    location @api_throttled {
        default_type application/json;
        add_header Retry-After 1 always;
        include snippets/pulsecities-security-headers.conf;
        return 429 '{"error":"Rate limit exceeded. See https://pulsecities.com/developers for the published limits."}';
    }

    # API — proxy to gunicorn with real IP forwarding
    location /api/ {
        limit_req zone=api_public burst=40 nodelay;
        error_page 429 = @api_throttled;
        # Responses set their own Cache-Control and several are per-key or
        # billable; none of them belong in the shared HTML cache.
        proxy_cache off;
        proxy_pass http://pulsecities_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

# Redirect www to the apex host so crawlers see one canonical origin
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.pulsecities.com;

    ssl_certificate /etc/letsencrypt/live/pulsecities.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pulsecities.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    return 301 https://pulsecities.com$request_uri;
}
