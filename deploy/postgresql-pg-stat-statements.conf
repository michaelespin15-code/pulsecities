# Query-level observability for PulseCities.
# Deploy: cp deploy/postgresql-pg-stat-statements.conf \
#            /etc/postgresql/14/main/conf.d/10-pg-stat-statements.conf
#
# WHY: there is currently no way to find a slow query on this box. A 2026-08-18
# performance pass wanted the top statements by total time and could not get
# them, so the only available signals were table-level seq_scan counts and
# hand-timed endpoints. That is enough to notice a problem and not enough to
# locate one.
#
# COST: a fixed shared-memory allocation of roughly 2MB at max=5000, plus a
# small per-statement bookkeeping overhead. Cheap next to 512MB shared_buffers.
#
# `track = top` records statements issued directly by the application and not
# those nested inside functions; the app issues plain SQL through SQLAlchemy,
# so nested tracking would only add noise.
#
# REQUIRES A RESTART, not a reload: shared_preload_libraries is read once at
# startup. Worth pairing with the raw_data drop window rather than spending a
# separate interruption on it. Afterwards, once per database:
#
#     sudo -u postgres psql -d pulsecities -c \
#         "CREATE EXTENSION IF NOT EXISTS pg_stat_statements;"
#
# Then the query that was wanted:
#
#     SELECT round(mean_exec_time::numeric, 1) AS ms, calls,
#            round((total_exec_time/1000)::numeric, 1) AS total_s,
#            left(regexp_replace(query, '\s+', ' ', 'g'), 100) AS q
#     FROM pg_stat_statements
#     ORDER BY total_exec_time DESC LIMIT 20;

shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
pg_stat_statements.track = top
